[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse"
version = "1.0.0"
description = "AI-powered customer analytics & demand forecasting platform for retail"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyarrow>=15",
  "pyyaml>=6",
  "joblib>=1.3",
  "prophet>=1.1.5",
  "tensorflow-cpu>=2.16",
  "mlflow>=2.12",
  "streamlit>=1.50",
  "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
retailpulse = "retailpulse.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]   # long lines are tolerated in dashboard/data code

[tool.ruff.lint.per-file-ignores]
"app/*" = ["E402"]   # dashboard adds src/ to sys.path before importing the package
