# Minimal MLflow tracking server (SQLite + local artifact store on a PVC).
# For real production use an external DB (Postgres) and object storage (S3/GCS/Azure) -
# change --backend-store-uri / --artifacts-destination accordingly and scale replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: retailpulse
  labels: {app: mlflow}
spec:
  replicas: 1
  strategy: {type: Recreate}      # SQLite on an RWO volume -> single writer
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      securityContext: {fsGroup: 10001}
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.16.1
          args:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            - --artifacts-destination=/mlflow/artifacts
            - --allowed-hosts=mlflow:5000,mlflow.retailpulse.svc.cluster.local:5000,localhost:5000
          ports: [{containerPort: 5000, name: http}]
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /mlflow}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mlflow-data}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: retailpulse
spec:
  selector: {app: mlflow}
  ports:
    - {name: http, port: 5000, targetPort: http}
